    Experience:
    - company: University of Toronto
      position: Course Instructor
      location: Mississauga, Ontario
      start_date: 2025-05-01
      end_date: 2025-08-01
      highlights:
        - Taught design methods course 'Understanding Users' to senior undergraduate students.
        - Conceptualized new modules and assignments to critically analyze the role of AI in UX research and practice.
        - Organized a guest lecture from a senior design strategist at Wells Fargo.

    - company: Microsoft Research
      position: Lead Experience Designer & Developer
      location: Remote
      start_date: 2021-02-01
      end_date: 2021-06-01
      highlights:
        - Developed a WhatsApp-based chat platform for low-literate rural communities for citizen journalism.
        - Iteratively designed interaction flows balancing user needs, resource constraints, and fieldworkers' workflows.
        - Full-stack development involving legacy server, website, content moderation interface, APIs, and database.
        - Implemented custom features to submit, share, and filter audio-, video-, and image-based journalism posts.
        - Successful adoption with 1000+ reports from users; continued usage at partner NGO.

    - company: Indiana University Bloomington Indiana, USA
      position: HCD Researcher
      location: Remote 
      start_date: 2020-08-01
      end_date: 2021-01-01
      highlights: 
        - Surveyed 200+ participants online to investigate privacy aspects of smartphone notifications.
        - Conducted mixed-method analysis (non-parametric statistical tests, thematic analysis, visualizations).
        - Published paper and recommended design features in smartphone UIs to prevent privacy violations.

    - company: Oracle Cloud Infrastructure (OCI)
      position: Software Developer
      location: Bangalore, India
      start_date: 2021-07-01
      end_date: 2022-08-01
      highlights: 
        - Designed and deployed solutions for the flagship organization-wide logging and monitoring agent to enhance observability and security in cloud infrastructure.
        - Developed open-source logging output plugin to support Debian OS.

